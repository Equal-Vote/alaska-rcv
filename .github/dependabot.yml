# Dependabot configuration.
#
# Policy (set deliberately -- please read before editing):
#
#   1. Routine version updates are minor/patch only. The `ignore` block drops
#      semver-major bumps. The `version-update:` prefix scopes that ignore to
#      VERSION updates only, so a security advisory whose only fix is a major
#      bump still opens a PR. Never drop the `update-types:` key from that
#      ignore entry -- a bare `dependency-name: "*"` would also silence
#      security updates.
#
#   2. Everything lands in as few PRs as possible.
#      `multi-ecosystem-groups` merges every ecosystem in this repo into ONE
#      pull request per week.
#
#   3. A multi-ecosystem group covers VERSION updates only -- it has no
#      `applies-to` key. Security advisories are therefore grouped per
#      ecosystem by the `*-security` groups below, so they still arrive as
#      one PR per ecosystem instead of one PR per advisory.
#
#   4. `open-pull-requests-limit` is a backstop, not the main control, and
#      security PRs are exempt from it entirely. Dependabot REJECTS the whole
#      file if this key appears on an update entry that belongs to a
#      multi-ecosystem group -- it must be set on the group instead. (The
#      published JSON schema does not catch this; Dependabot's own validator
#      does.) On single-ecosystem repos it stays on the entry, where it is
#      counted per entry rather than per repo.
#
#   5. Cooldown holds brand-new releases for a few days, which blunts
#      compromised-release supply-chain attacks. Only semver ecosystems accept
#      `semver-*-days`; docker, docker-compose, github-actions, terraform and
#      pip take `default-days` alone and are REJECTED if given the semver keys.
#
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: daily
      time: "22:27"
    labels:
      - dependencies

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
