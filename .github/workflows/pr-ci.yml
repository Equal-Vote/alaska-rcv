# Build check for pull requests.
#
# Without this, nothing verifies a pull request at all -- the only other
# workflow runs on push to the default branch, after the merge. That makes
# dependency bumps unreviewable in practice: the PR looks green because
# nothing is checking it.
#
# Actions are pinned by commit SHA rather than tag, matching the convention
# already used elsewhere in this org and required by the zizmor audit.
#
# Node is pinned to the version in this repo Dockerfile so CI matches what
# actually ships.
#
# `npm test` runs rstest in jsdom: it renders the app across every
# election/dimension route and fails on new React console errors, plus unit
# tests for the simulation maths and the election content data. It runs before
# the build because it is the faster of the two.
#
# The e2e step then runs Playwright against the built bundle in a real browser.
# jsdom has to stub requestAnimationFrame and ResizeObserver to stay
# deterministic (see src/setupTests.ts), which pins it to the first painted
# frame and leaves @mui/x-charts measuring a 0x0 container -- so a MUI or
# emotion bump can break layout with every other step green. Verified: setting
# the chart width to 0 fails Playwright while all 242 jsdom tests still pass.
#
# That step asserts layout invariants (non-zero boxes, a page that cannot be
# scrolled sideways, a chart that actually measured itself), NOT pixel
# screenshots -- Voter.js mixes Math.random() into voter positions every physics
# frame, so a pixel baseline would be flaky by construction. See the comment at
# the top of playwright.config.ts.
name: PR CI

"on":
  pull_request:

# Read-only: this workflow never needs to write to the repo.
permissions:
  contents: read

# A new push to a PR makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job token in .git/config unless told
          # otherwise. Nothing here pushes, so drop it (zizmor:
          # artipacked).
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc so this and the Dockerfile's base image tag stay
          # on the same Node version. Pinning the version inline here let the
          # two drift: Dependabot bumps the Dockerfile (a docker image tag it
          # can see) but cannot see a version string in workflow YAML, so CI
          # sat on 20.11.1 while packages requiring ^20.19.0 landed.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Only chromium: these assertions are about layout, which does not differ
      # meaningfully across engines, so WebKit and Firefox would triple the
      # install and run cost for close to no extra signal.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `playwright test` rather than `npm run test:e2e`, because that script
      # rebuilds and the Build step above already produced build/.
      - name: E2E
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lint
        run: npm run lint

      # Last because it is by far the slowest: it repeats npm ci and the bundle
      # inside the image.
      #
      # Nothing verified the Dockerfile before this. The deploy workflow only
      # runs on push to main, so a Dockerfile or dependency problem was invisible
      # until after the merge -- which is exactly how `npm run build` came to be
      # broken in the image while every PR stayed green. Building here (without
      # pushing) moves that signal to the PR, where a Dependabot bump can still
      # be declined.
      #
      # Plain `docker build` rather than docker/build-push-action: the runner
      # ships docker, this needs no registry, no cache and no multi-arch, and it
      # keeps the workflow from taking on another pinned action.
      - name: Docker build
        run: docker build --tag alaska-rcv:ci .
